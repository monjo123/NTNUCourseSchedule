<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTNU 選課規劃系統</title>
  <meta name="description" content="搜尋 NTNU 課程、加入規劃、檢查衝突並保存選課清單。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #fbf9f6;
      --bg-2: #f4f0ea;
      --panel: rgba(255, 255, 255, 0.84);
      --panel-strong: #ffffff;
      --text: #263231;
      --muted: #6b7a79;
      --line: #e4e0d8;
      --accent: #1e5652;
      --accent-rgb: 30, 86, 82;
      --accent-2: #1e5652;
      --btn-primary-text: #ffffff;
      --btn-secondary-bg: #eaf2f1;
      --btn-secondary-text: #1e5652;
      --tag-bg: #f3f5f4;
      --tag-text: #3a635f;
      --warn-bg: #fff4e6;
      --warn-text: #b45309;
      --warn-rgb: 180, 83, 9;
      --danger: var(--warn-text);
      --success: #3a635f;
      --shadow: 0 18px 60px rgba(64, 45, 22, 0.09);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --btn-soft-bg: #e4e9e8;
      --btn-soft-text: #4a5553;
      --btn-soft-danger-hover-bg: #fee2e2;
      --btn-soft-danger-hover-text: #b91c1c;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(var(--accent-rgb), 0.08), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(var(--warn-rgb), 0.10), transparent 24%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      font-family: "Space Grotesk", "Noto Sans TC", "PingFang TC", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.10) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.16), transparent 82%);
      opacity: 0.5;
    }

    .shell {
      position: relative;
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px;
      z-index: 1;
    }

    .hero {
      display: grid;
      gap: 18px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(247, 244, 239, 0.72));
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(var(--accent-rgb), 0.08);
      color: var(--accent);
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: clamp(2rem, 4vw, 4.4rem);
      line-height: 0.98;
      letter-spacing: -0.03em;
    }

    .hero p {
      max-width: 62rem;
      margin: 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.75;
    }

    .update-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: fit-content;
      max-width: 62rem;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--warn-bg);
      border: 1px solid rgba(var(--warn-rgb), 0.18);
      color: var(--warn-text);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .update-notice strong {
      color: var(--warn-text);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-soft {
      background: var(--btn-soft-bg);
      color: var(--btn-soft-text);
      border: none;
      box-shadow: none;
    }

    .btn-soft:hover {
      background: #d1e0de;
      color: var(--accent);
      box-shadow: none;
    }

    /* 修正「清空規劃」按鈕的預設樣式，統一背景並淡化文字 */
    .btn.btn-soft.danger {
        background: var(--btn-soft-bg); /* 強制套用與其他按鈕相同的淡綠色底 */
        color: #7a8786; /* 將文字顏色改為較淡的灰色，降低視覺干擾 */
    }

    /* 滑鼠懸停 (Hover) 時的狀態：保留稍微的警告提示 */
    .btn.btn-soft.danger:hover {
        background: var(--btn-soft-danger-hover-bg); /* 淡淡的警告紅底 */
        color: var(--btn-soft-danger-hover-text); /* 警告紅字 */
    }

    /* 方案一：現代底線型分頁 */
    .layout-1 .views-tabs {
      padding: 18px 22px 0;
      background: transparent;
      border-bottom: none;
    }

    .layout-1 .view-tabs {
      display: flex;
      gap: 32px;
      padding: 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .layout-1 .view-tab {
      font: inherit;
      font-size: 18px;
      padding: 12px 4px;
      color: var(--muted);
      cursor: pointer;
      position: relative;
      top: 1px;
      border: none;
      background: none;
      border-radius: 0;
      width: auto;
      text-align: left;
      transition: color 0.18s ease;
    }

    .layout-1 .view-tab-title {
      font-weight: inherit;
      font-size: inherit;
      line-height: 1.2;
    }

    .layout-1 .view-tab-desc {
      display: none;
    }

    .layout-1 .view-tab:hover {
      transform: none;
      color: var(--accent);
    }

    .layout-1 .view-tab[aria-selected="true"] {
      color: var(--accent);
      font-weight: 600;
      border-bottom: 3px solid var(--accent);
      background: none;
      box-shadow: none;
    }

    .views {
      margin-top: 22px;
    }

    .view-panel[hidden] {
      display: none !important;
    }

    #plannerView {
      width: 100%;
      min-width: 0;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: clip;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 16px;
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header h2 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: 1.4rem;
    }

    .panel-header p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.92rem;
    }

    .content {
      padding: 18px 22px 22px;
      min-width: 0;
    }

    .catalog-filters {
      margin-bottom: 14px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .summary-card {
      padding: 18px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--line);
      box-shadow: 0 12px 36px rgba(64, 45, 22, 0.06);
    }

    .summary-card .label {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 10px;
    }

    .summary-card strong {
      display: block;
      font-size: 1.8rem;
      line-height: 1;
    }

    .summary-card small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.5;
    }

    .toolbar {
      display: grid;
      gap: 12px;
      padding: 18px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--line);
    }

    .toolbar-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 0.7fr));
      gap: 12px;
      align-items: start;
    }

    /* Ensure deptSelectMenu options each occupy their own line */
    #deptSelectMenu label {
      display: block;
      width: 100%;
      padding: 6px 4px;
      cursor: pointer;
      white-space: normal;
    }

    #deptSelectMenu .dept-checkbox {
      margin-right: 8px;
      vertical-align: middle;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.82rem;
    }

    input,
    select,
    button,
    textarea {
      font: inherit;
    }

    input[type="search"],
    select {
      width: 100%;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    input[type="search"]:focus,
    select:focus {
      border-color: rgba(var(--accent-rgb), 0.45);
      box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.10);
    }

    .muted {
      color: var(--muted);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
    }

    .chip {
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.82rem;
      line-height: 1.35;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .chip.warn {
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .chip.soft {
      background: var(--tag-bg);
      color: var(--tag-text);
    }

    .results-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 18px 0 14px;
    }

    .results-head .page-size-inline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .results-head .page-size-inline select {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
      font-size: 0.9rem;
      color: var(--text);
      min-width: 86px;
      height: 36px;
      cursor: pointer;
    }

    .results-head strong {
      font-size: 1rem;
    }

    .results-grid {
      display: grid;
      gap: 12px;
    }

    .pagination-panel {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .pagination-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .page-btn {
      min-width: 2.5rem;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .page-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(var(--accent-rgb), 0.3);
      box-shadow: 0 10px 22px rgba(64, 45, 22, 0.06);
    }

    .page-btn.is-active {
      background: linear-gradient(135deg, var(--accent), #204f4c);
      color: var(--btn-primary-text);
      border-color: transparent;
      box-shadow: 0 12px 26px rgba(var(--accent-rgb), 0.18);
    }

    .course-card,
    .selected-card,
    .day-column,
    .empty-state {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.84);
      border-radius: var(--radius-lg);
    }

    .course-card {
      display: grid;
      gap: 12px;
      padding: 18px;
    }

    .course-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .course-top-actions {
      display: inline-flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
      min-width: 120px;
    }

    .course-title {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .course-title h3,
    .selected-card h3 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .course-title p,
    .selected-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.9rem;
    }

    .meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.8rem;
    }

    .meta.conflict {
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .course-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      border: 0;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, background 0.18s ease;
      user-select: none;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn.primary {
      background: var(--accent);
      color: var(--btn-primary-text);
      box-shadow: 0 12px 26px rgba(var(--accent-rgb), 0.18);
    }

    .btn.secondary {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
    }

    .btn.ghost {
      background: rgba(255, 255, 255, 0.88);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn.danger {
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .panel-sticky {
      position: sticky;
      top: 18px;
    }

    .selected-list {
      display: grid;
      gap: 12px;
    }

    .selected-card {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .selected-card header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .selected-card .course-title h3 {
      font-size: 1rem;
    }

    .schedule {
      display: grid;
      margin-top: 14px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      min-width: 0;
      max-width: 100%;
    }

    .schedule-table {
      display: grid;
      grid-template-columns: 60px repeat(7, 1fr);
      min-width: 920px;
      width: max(100%, 920px);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.78);
    }

    .schedule-header-row,
    .schedule-body-row {
      display: contents;
    }

    .schedule-cell-label {
      padding: 12px 8px;
      font-size: 0.82rem;
      font-weight: 600;
      background: rgba(var(--accent-rgb), 0.08);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .schedule-header-row .schedule-cell-label {
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.12), rgba(var(--accent-rgb), 0.08));
      border-bottom: 2px solid rgba(var(--accent-rgb), 0.16);
    }

    .schedule-cell-header {
      padding: 12px 8px;
      font-size: 0.82rem;
      font-weight: 600;
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.12), rgba(var(--accent-rgb), 0.08));
      color: var(--accent);
      text-align: center;
      border-right: 1px solid var(--line);
      border-bottom: 2px solid rgba(var(--accent-rgb), 0.16);
    }

    .schedule-cell-header:last-child {
      border-right: none;
    }

    .schedule-cell {
      min-height: 80px;
      padding: 8px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-content: start;
      overflow-y: auto;
    }

    .schedule-body-row .schedule-cell:last-child {
      border-right: none;
    }

    .schedule-item {
      padding: 8px 10px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.12), rgba(var(--accent-rgb), 0.06));
      border: 1px solid rgba(var(--accent-rgb), 0.12);
      display: grid;
      gap: 3px;
      font-size: 0.78rem;
      line-height: 1.3;
      flex-shrink: 0;
    }

    .schedule-item strong { font-size: 0.8rem; line-height: 1.2; }
    .schedule-item small { color: var(--muted); font-size: 0.72rem; }

    .empty-state {
      padding: 20px;
      color: var(--muted);
      line-height: 1.7;
    }

    .footer-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .loading,
    .error {
      padding: 20px;
      color: var(--muted);
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 1180px) {
      .panel-sticky {
        position: static;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 720px) {
      .shell { padding: 14px; }

      .hero,
      .panel-header,
      .content,
      .views-tabs { padding-left: 16px; padding-right: 16px; }

      .toolbar-grid,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .update-notice {
        width: 100%;
      }

      .hero-actions .btn-soft {
        width: 100%;
      }

      .layout-1 .view-tabs {
        gap: 24px;
      }

      .layout-1 .view-tab {
        font-size: 16px;
        padding: 10px 2px;
      }

      .schedule-cell {
        min-height: 60px;
        padding: 4px;
      }

      .course-top,
      .course-actions,
      .selected-card header {
        flex-direction: column;
        align-items: stretch;
      }
    }

    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      pointer-events: none;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-panel {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      transform: translateY(-20px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.open .modal-panel {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: 1.3rem;
      line-height: 1.3;
    }

    .modal-close {
      flex-shrink: 0;
      cursor: pointer;
      color: var(--muted);
      font-size: 1.4rem;
      line-height: 1;
      background: none;
      border: none;
      padding: 0;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-body {
      display: grid;
      gap: 16px;
    }

    .modal-row {
      display: grid;
      gap: 6px;
    }

    .modal-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .modal-value {
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    #selectedList {
      display: none !important;
    }

    #slotPickerContainer .btn {
        padding: 8px 18px;
        font-size: 0.9rem;
        border-radius: 999px;
        box-shadow: none;
    }

    #freeSlotSearch {
        background-color: var(--accent);;
        color: #ffffff;
        box-shadow: 0 2px 4px rgba(13, 148, 136, 0.2);
    }
    #freeSlotSearch:hover {
        background-color: var(--accent);;
        box-shadow: 0 4px 6px rgba(13, 148, 136, 0.3);
    }

    #invertSlotSelection {
        background-color: #ffffff;
        border: 1px solid #d1d5db !important;
        color: #4b5563;
    }
    #invertSlotSelection:hover {
        background-color: #f3f4f6;
    }

    #clearSlotSelection {
        background-color: #ffffff;
        border: 1px solid #d1d5db !important;
        color: #7a8786; /* 將文字顏色改為較淡的灰色，降低視覺干擾 */
    }
    #clearSlotSelection:hover {
        background: var(--btn-soft-danger-hover-bg); /* 淡淡的警告紅底 */
        color: var(--btn-soft-danger-hover-text); /* 警告紅字 */
    }

    #slotPicker {
        display: grid !important;
        grid-template-columns: 44px repeat(7, 1fr) !important;
        gap: 1px !important;
        background-color: var(--line);
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    #slotPicker.is-dragging {
        cursor: crosshair;
    }

    #slotPicker > .slot-cell {
        background: #ffffff !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        padding: 0 !important;
        min-height: 26px;
        font-size: 0.82rem;
        line-height: 1;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
    }

    #slotPicker > .slot-cell:not([data-day]):not(.time-label) {
        color: var(--muted);
        font-weight: 600;
        background: #f5f3ef !important;
    }

    #slotPicker .time-label {
        cursor: default !important;
        color: var(--muted);
        font-weight: 600;
        background: #f5f3ef !important;
    }

    #slotPicker .slot-cell[data-day] {
        position: relative;
        cursor: pointer;
        background-color: #ffffff !important;
        transition: background-color 0.1s ease;
    }

    #slotPicker .slot-cell[data-day]::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--accent);
        opacity: 0;
        transform: scale(0.85);
        transition: opacity 0.12s ease, transform 0.12s ease;
        pointer-events: none;
    }

    #slotPicker .slot-cell[data-day]:hover:not(.is-selected) {
        background-color: rgba(var(--accent-rgb), 0.12) !important;
    }

    #slotPicker.is-dragging .slot-cell[data-day]:hover:not(.is-selected) {
        background-color: rgba(var(--accent-rgb), 0.22) !important;
    }

    #slotPicker .slot-cell[data-day].is-selected {
        background-color: transparent !important;
    }

    #slotPicker .slot-cell[data-day].is-selected::before {
        opacity: 1;
        transform: scale(1);
    }

    #slotPicker .slot-cell[data-day].is-selected:hover::before {
        background: #174945;
    }


    .slot-actions {
        display: flex !important;
        justify-content: flex-end !important;
        gap: 8px !important;
        padding: 12px !important;
        border-top: 1px solid var(--line);
        background: #ffffff;
    }
  </style>
</head>
<body>
  <div id="courseDetailModal" class="modal-overlay">
    <div class="modal-panel">
      <div class="modal-header">
        <div>
          <h3 id="modalCourseName"></h3>
          <p id="modalCourseCode" style="margin: 6px 0 0; color: var(--muted); font-size: 0.9rem;"></p>
        </div>
        <button class="modal-close" type="button" id="modalCloseBtn">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-row">
          <div class="modal-label">教師</div>
          <div class="modal-value" id="modalTeacher"></div>
        </div>
        <div class="modal-row">
          <div class="modal-label">時間</div>
          <div class="modal-value" id="modalTime"></div>
        </div>
        <div class="modal-row">
          <div class="modal-label">教室</div>
          <div class="modal-value" id="modalRoom"></div>
        </div>
        <div class="modal-row">
          <div class="modal-label">學分</div>
          <div class="modal-value" id="modalCredit"></div>
        </div>
        <div class="modal-row">
          <div class="modal-label">名額</div>
          <div class="modal-value" id="modalSeat"></div>
        </div>
        <div id="modalRestrictRow" class="modal-row" style="display: none;">
          <div class="modal-label">限制</div>
          <div class="modal-value" id="modalRestrict" style="white-space: pre-line;"></div>
        </div>
        <div id="modalCommentRow" class="modal-row" style="display: none;">
          <div class="modal-label">備註</div>
          <div class="modal-value" id="modalComment"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn danger" id="modalRemoveBtn" type="button">移除課程</button>
        <button class="btn ghost" id="modalDoneBtn" type="button">完成</button>
      </div>
    </div>
  </div>

  <div class="shell">
    <header class="hero">
      <div class="eyebrow">NTNU Course Planner</div>
      <h1>選課規劃系統</h1>
      <p>把課程資料變成可搜尋、可加入、可檢查衝突的選課規劃工具。支援課程搜尋、條件篩選、學分統計、週課表檢視，以及本機保存與匯出。</p>
      <div class="update-notice" role="status" aria-live="polite">
        <strong>更新提醒</strong>
        <span>資料會在每週一 09:00 自動更新，更新期間系統可能出現約 10 分鐘卡頓。</span>
      </div>
      <div class="hero-actions">
        <button class="btn btn-soft" data-role="export" id="exportBtn" type="button">匯出規劃</button>
        <button class="btn btn-soft" data-role="import" id="importBtn" type="button">匯入規劃</button>
        <button class="btn btn-soft danger" data-role="clear" id="clearBtn" type="button">清空規劃</button>
      </div>
    </header>

    <div class="views panel layout-1">
      <div class="views-tabs">
        <div class="view-tabs" role="tablist" aria-label="主要分頁">
          <button class="view-tab" id="catalogTab" type="button" role="tab" aria-selected="true" aria-controls="catalogView">課程目錄</button>
          <button class="view-tab" id="plannerTab" type="button" role="tab" aria-selected="false" aria-controls="plannerView">我的規劃</button>
        </div>
      </div>

      <section class="view-panel" id="catalogView" data-view="catalog">
        <div class="content">
          <div class="chips catalog-filters" id="activeFilters"></div>
          <div class="toolbar">
            <div class="toolbar-grid">
              <div class="field">
                <label for="searchInput">搜尋</label>
                <input id="searchInput" type="search" placeholder="課名、教師、課號、時間、備註">
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                  <label id="slotPickerLabel" style="cursor:pointer; user-select:none; flex:1;">時段勾選<span style="font-size:0.85em; color:var(--muted);">（勾選多節後只顯示完全在勾選時段內的課程）</span></label>
                  <button id="toggleSlotPicker" type="button" style="background:none; border:none; cursor:pointer; font-size:1.2em; padding:0 4px; color:var(--text);">▼</button>
                </div>
                <div id="slotPickerContainer" style="border: 1px solid var(--line); border-radius: 12px; background: white; overflow: hidden;">
                    <!-- JS 會自動將生成的 grid 插入此處 -->
                    <div id="slotPicker"></div>

                    <!-- 按鈕區域：新增了 slot-actions 類別，確保按鈕靠右整齊 -->
                    <div class="slot-actions">
                        <button class="btn secondary" id="clearSlotSelection" type="button">清除時段勾選</button>
                        <button class="btn secondary" id="invertSlotSelection" type="button">反向選取</button>
                        <button class="btn primary" id="freeSlotSearch" type="button">空堂查詢</button>
                    </div>
                </div>
              </div>
              <div class="field">
                <label for="deptSelect">系所/分類</label>
                <button id="deptSelectToggle" type="button" style="width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,0.95); cursor:pointer;">
                  <span id="deptSelectLabel">全部系所/分類</span>
                  <span aria-hidden="true">▾</span>
                </button>
                <div id="deptSelectMenu" style="display:none; margin-top:8px; max-height:180px; overflow:auto; padding:8px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,0.98);"></div>
              </div>
              <div class="field">
                <label for="semesterSelect">學期</label>
                <select id="semesterSelect">
                  <option value="113_1">113-1</option>
                  <option value="113_2">113-2</option>
                  <option value="114_1">114-1</option>
                  <option value="114_2">114-2</option>
                  <option value="115_1">115-1</option>
                  <option value="115_2" selected>115-2</option>
                </select>
              </div>
              <div class="field">
                <label for="sortSelect">排序</label>
                <select id="sortSelect"></select>
              </div>
              <!-- pageSizeSelect moved next to results header for compact layout -->
            </div>
          </div>

          <div class="results-head">
            <strong id="resultsLabel">載入中...</strong>
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="chips">
                <span class="chip" id="courseCountChip">0 門課程</span>
                <span class="chip soft" id="visibleCountChip">0 筆顯示</span>
              </div>
              <div class="page-size-inline">
                <label for="pageSizeSelect" class="muted" style="font-size:0.9rem;">每頁</label>
                <select id="pageSizeSelect"></select>
              </div>
            </div>
          </div>

          <div id="results" class="results-grid"></div>
          <div class="pagination-panel">
            <div class="pagination-meta">
              <span id="paginationLabel" class="muted">第 1 頁</span>
              <button class="btn ghost" id="resetBtn" type="button">重設篩選</button>
            </div>
            <div class="pagination" id="pageButtons" aria-label="課程頁碼"></div>
          </div>
        </div>
      </section>

      <section class="view-panel" id="plannerView" data-view="planner" hidden>
        <div class="content">
          <section class="summary-grid" id="summaryGrid" aria-live="polite"></section>
          <div id="plannerSummary" class="chips" style="margin-top: 14px;"></div>
          <div id="selectedList" class="selected-list" style="margin-top: 14px;"></div>

          <div style="margin-top: 22px;">
            <div class="results-head" style="margin-top: 0;">
              <strong>週課表</strong>
              <span class="muted" id="scheduleHint">尚未加入課程</span>
            </div>
            <div class="schedule" id="scheduleBoard"></div>
            <div class="footer-note">時間欄位以原始資料中的上課週期與節次為準，衝突檢查會依節次重疊判定。</div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="./scripts/planner.js"></script>
</body>
</html>
